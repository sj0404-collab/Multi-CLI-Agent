name: Build Uni-Browser APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'browser-apk/**'
      - 'browser-app/**'
  workflow_dispatch:

jobs:
  build:
    name: Build browser APK (WebView)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          sudo mkdir -p /opt/android-sdk
          sudo chown -R $USER /opt/android-sdk
          cd /opt/android-sdk
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/source.properties cmdline-tools/latest/ 2>/dev/null || true
          export PATH=/opt/android-sdk/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
        env:
          ANDROID_HOME: /opt/android-sdk
        timeout-minutes: 20

      - name: Sync browser-app into browser-apk assets
        run: |
          cp -r browser-app/index.html browser-apk/app/src/main/assets/
          cp -r browser-app/style.css browser-apk/app/src/main/assets/
          cp -r browser-app/app.js browser-apk/app/src/main/assets/

      - name: Build APK (assembleRelease)
        run: |
          cd browser-apk
          echo "sdk.dir=/opt/android-sdk" > local.properties
          gradle assembleRelease --no-daemon 2>&1 | tail -60 || {
            echo "gradle not installed, installing wrapper...";
            wget -q https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew -O gradlew 2>/dev/null || true;
          }
          # fallback: сгенерировать wrapper
          export ANDROID_HOME=/opt/android-sdk
          cd browser-apk
          if command -v gradle >/dev/null 2>&1; then
            gradle assembleRelease --no-daemon 2>&1 | tail -60
          else
            echo "Устанавливаю gradle..."
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
            /opt/gradle-8.5/bin/gradle assembleRelease --no-daemon 2>&1 | tail -60
          fi
        env:
          ANDROID_HOME: /opt/android-sdk
        timeout-minutes: 25

      - name: Collect APK
        run: |
          mkdir -p dist
          find . -name '*.apk' -path '*release*' -exec cp {} dist/ \;
          ls -la dist/ 2>/dev/null || echo "APK не найден"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uni-browser-apk
          path: dist/*.apk
