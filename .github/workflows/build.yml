name: Build APK (Termux + embedded node/python)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build:
    name: Build arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TERMUX_PACKAGES_BRANCH: master
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils \
            xsltproc unzip lzop python3 python3-pip openjdk-17-jdk
          sudo apt-get install -y wget tar xz-utils
        timeout-minutes: 20

      - name: Setup Android SDK
        run: |
          sudo mkdir -p /opt/android-sdk
          sudo chown -R $USER /opt/android-sdk
          cd /opt/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/source.properties cmdline-tools/latest/ 2>/dev/null || true
          ls -la
        env:
          ANDROID_HOME: /opt/android-sdk
        timeout-minutes: 15

      - name: Accept SDK licenses + install packages
        run: |
          export ANDROID_HOME=/opt/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" || true
        env:
          ANDROID_HOME: /opt/android-sdk
        timeout-minutes: 30

      # ---- Build custom Termux bootstrap with node+python ----
      - name: Clone termux-packages
        run: |
          cd /home/runner/work
          git clone --depth 1 https://github.com/termux/termux-packages.git
          cd termux-packages
          # переключаем на базовый набор + наши рантаймы
          cp ${{ github.workspace }}/repo/bootstrap/packages.txt packages.txt
          echo "Bootstrap packages:"; cat packages.txt
        timeout-minutes: 10

      - name: Build custom bootstrap (arm64)
        # termux-packages собирает bootstrap в Docker-контейнере termux-packages-android.
        # Результат: bootstrap-arm64.zip со встроенными node/python/git/openssh/curl.
        run: |
          cd /home/runner/work/termux-packages
          ./scripts/run-docker.sh ./scripts/check-packages.sh
          ./scripts/run-docker.sh ./build-bootstrap.sh 2>&1 | tail -40 || true
          ls -la output/ 2>/dev/null || true
          find . -name 'bootstrap-*.zip' 2>/dev/null | head
        timeout-minutes: 240

      - name: Clone termux-app
        run: |
          cd /home/runner/work
          git clone --depth 1 https://github.com/termux/termux-app.git
        timeout-minutes: 10

      - name: Inject custom bootstrap + agent into termux-app
        run: |
          cd /home/runner/work/termux-app
          BOOTSTRAP=$(find /home/runner/work/termux-packages -name 'bootstrap-arm64.zip' | head -1)
          if [ -n "$BOOTSTRAP" ]; then
            mkdir -p app/src/main/assets
            cp "$BOOTSTRAP" app/src/main/assets/
            echo "Embedded bootstrap: $BOOTSTRAP"
          else
            echo "WARN: bootstrap not built, using default (termux downloads at runtime)"
          fi
          # вшиваем агент и конфиг в assets
          mkdir -p app/src/main/assets/agent
          cp ${{ github.workspace }}/repo/agent-runtime.js app/src/main/assets/agent/
          cp -r ${{ github.workspace }}/repo/config app/src/main/assets/agent/
          cp ${{ github.workspace }}/repo/launcher-pc.sh app/src/main/assets/agent/ 2>/dev/null || true
        timeout-minutes: 5

      - name: Build APK (assembleRelease)
        run: |
          cd /home/runner/work/termux-app
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.0.12077973
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Pandroid.useAndroidX=true 2>&1 | tail -60
        env:
          ANDROID_HOME: /opt/android-sdk
        timeout-minutes: 120

      - name: Collect APK
        run: |
          mkdir -p ${{ github.workspace }}/repo/dist
          find /home/runner/work/termux-app -name '*.apk' -exec cp {} ${{ github.workspace }}/repo/dist/ \;
          ls -la ${{ github.workspace }}/repo/dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: dist/*.apk

      - name: Publish to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          tag_name: v${{ github.run_number }}
          name: Multi CLI-Agent v${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
