name: Build APK (Multi CLI Agent - separate from Termux)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ created ]

env:
  NEW_PACKAGE: com.termux.multiagent

jobs:
  build:
    name: Build arm64 APK (unique package + own signature)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils \
            xsltproc unzip lzop python3 python3-pip openjdk-17-jdk wget tar xz-utils
        timeout-minutes: 20

      # ---- Clone termux-packages to build a bootstrap for OUR package name ----
      - name: Clone termux-packages
        run: |
          cd ${{ github.workspace }}
          git clone --depth 1 https://github.com/termux/termux-packages.git
        timeout-minutes: 15

      - name: Setup Android SDK + NDK (required by termux-packages)
        run: |
          sudo apt-get install -y unzip zip wget 2>/dev/null || true
          cd ${{ github.workspace }}/termux-packages
          REV=9123335
          export ANDROID_HOME="$PWD/build-tools/android-sdk-$REV"
          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME"
          # Явно ставим commandlinetools в cmdline-tools/latest/bin/sdkmanager.
          # (setup-android-sdk.sh качает tools, но при TERMUX_SDK_REVISION=9123335
          # zip раскладывается нестандартно и sdkmanager не оказывается на месте.)
          curl -sL --max-time 300 -o /tmp/cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p /tmp/cmdtools
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -r /tmp/cmdtools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/" 2>/dev/null || \
            cp -r /tmp/cmdtools/* "$ANDROID_HOME/cmdline-tools/latest/"
          SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "sdkmanager: $SDK_MGR"
          ls -la "$ANDROID_HOME/cmdline-tools/latest/bin/" | head
          # licenses
          yes | "$SDK_MGR" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          # Компоненты, которые требуют build-bootstraps и gradle пакета apt.
          "$SDK_MGR" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;30.0.3" \
            "platforms;android-33" \
            "platforms;android-28" \
            "platforms;android-30" \
            "platforms;android-24" \
            2>&1 | tail -15 || true
          echo "=== platforms ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null
          echo "=== build-tools ==="
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null
          # NDK (нужен для компиляции)
          ./scripts/setup-android-sdk.sh 2>&1 | tail -15 || true
          find "$PWD/build-tools" -maxdepth 1 -type d 2>/dev/null | head
        timeout-minutes: 60

      - name: Set custom package name + build bootstrap (aarch64)
        # Меняем TERMUX_APP_PACKAGE на com.termux.multiagent и собираем bootstrap
        # с nodejs/python через build-bootstraps.sh (компилирует под наш пакет).
        run: |
          cd ${{ github.workspace }}/termux-packages
          sed -i "s/^TERMUX_APP_PACKAGE=.*/TERMUX_APP_PACKAGE=com.termux.multiagent/" scripts/properties.sh
          grep "^TERMUX_APP_PACKAGE" scripts/properties.sh
          # Долгая компиляция nodejs/python для aarch64 под наш пакет.
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh \
            --architectures aarch64 \
            --add nodejs-lts,python,git,openssh,curl,jq,openssl-tool,nano \
            2>&1 | tail -100
          echo "=== bootstrap artifact ==="
          find . -name 'bootstrap-*.zip' | head
          ls -la bootstrap-aarch64.zip 2>/dev/null || true
        timeout-minutes: 280

      - name: Clone termux-app
        run: |
          cd ${{ github.workspace }}
          git clone --depth 1 https://github.com/termux/termux-app.git
        timeout-minutes: 15

      - name: Inject bootstrap + rename package + sign + agent
        run: |
          chmod +x ${{ github.workspace }}/repo/scripts/patch-termux.sh
          ${{ github.workspace }}/repo/scripts/patch-termux.sh \
            ${{ github.workspace }}/termux-app \
            ${{ github.workspace }}/termux-packages \
            ${{ github.workspace }}/repo \
            com.termux.multiagent
        timeout-minutes: 10

      - name: Build APK (assembleRelease, signed)
        run: |
          cd ${{ github.workspace }}/termux-app
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tail -100
        timeout-minutes: 120

      - name: Verify signature
        run: |
          APK=$(find ${{ github.workspace }}/termux-app -name '*release*.apk' | grep -v universal | head -1)
          APK=$(find ${{ github.workspace }}/termux-app -name '*.apk' | head -1)
          echo "APK: $APK"
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$APK" 2>/dev/null || \
            /opt/android-sdk/build-tools/*/apksigner verify --print-certs "$APK" 2>/dev/null || \
            echo "(apksigner path not found, will verify via unzip)"
          unzip -l "$APK" 2>/dev/null | grep -E "libtermux-bootstrap|assets/agent" | head

      - name: Collect APK
        run: |
          mkdir -p ${{ github.workspace }}/repo/dist
          find ${{ github.workspace }}/termux-app -name '*.apk' -exec cp {} ${{ github.workspace }}/repo/dist/ \;
          ls -la ${{ github.workspace }}/repo/dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-multiagent-arm64
          path: repo/dist/*.apk
