name: Build APK (Termux + embedded node/python)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build:
    name: Build arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg zip curl wget tar xz-utils unzip \
            openjdk-17-jdk coreutils python3
        timeout-minutes: 15

      - name: Download official Termux bootstrap (aarch64)
        run: |
          mkdir -p ${{ github.workspace }}/bootstrap
          curl -sL --max-time 300 -o ${{ github.workspace }}/bootstrap/bootstrap-aarch64.zip \
            "https://github.com/termux/termux-packages/releases/download/bootstrap-2026.08.09-r1%2Bapt.android-7/bootstrap-aarch64.zip"
          ls -la ${{ github.workspace }}/bootstrap/
          # проверка, что это валидный zip
          unzip -t ${{ github.workspace }}/bootstrap/bootstrap-aarch64.zip >/dev/null && echo "zip OK"
        timeout-minutes: 15

      - name: Clone termux-app
        run: |
          cd ${{ github.workspace }}
          git clone --depth 1 https://github.com/termux/termux-app.git
        timeout-minutes: 15

      - name: Inject bootstrap + agent into termux-app
        run: |
          chmod +x ${{ github.workspace }}/repo/scripts/patch-termux.sh
          ${{ github.workspace }}/repo/scripts/patch-termux.sh \
            ${{ github.workspace }}/termux-app \
            ${{ github.workspace }}/bootstrap \
            ${{ github.workspace }}/repo
        timeout-minutes: 5

      - name: Build APK (assembleRelease)
        run: |
          cd ${{ github.workspace }}/termux-app
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tail -80
        timeout-minutes: 60

      - name: Collect APK
        run: |
          mkdir -p ${{ github.workspace }}/repo/dist
          find ${{ github.workspace }}/termux-app -name '*.apk' -exec cp {} ${{ github.workspace }}/repo/dist/ \;
          ls -la ${{ github.workspace }}/repo/dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: dist/*.apk

      - name: Publish to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          tag_name: v${{ github.run_number }}
          name: Multi CLI-Agent v${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
