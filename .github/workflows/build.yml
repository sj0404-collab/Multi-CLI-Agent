name: Build APK (Termux + embedded node/python)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build:
    name: Build arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg zip curl wget tar xz-utils unzip \
            openjdk-17-jdk coreutils build-essential
        timeout-minutes: 15

      - name: Clone termux-packages
        run: |
          cd ${{ github.workspace }}
          git clone --depth 1 https://github.com/termux/termux-packages.git
        timeout-minutes: 15

      # ---- Build custom bootstrap (arm64) with node+python+etc inside docker ----
      - name: Build custom bootstrap (arm64)
        run: |
          cd ${{ github.workspace }}/termux-packages
          cat ${{ github.workspace }}/repo/bootstrap/packages.txt
          # nodejs-lts, python и прочее добавляем в bootstrap через --add
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh \
            --architectures aarch64 \
            --add nodejs-lts,python,git,openssh,curl,jq,openssl-tool,nano \
            2>&1 | tail -60
          echo "=== bootstrap artifacts ==="
          ls -la bootstrap-aarch64.zip 2>/dev/null || find . -name 'bootstrap-*.zip' | head
        timeout-minutes: 240

      - name: Clone termux-app
        run: |
          cd ${{ github.workspace }}
          git clone --depth 1 https://github.com/termux/termux-app.git
        timeout-minutes: 15

      - name: Inject custom bootstrap + agent into termux-app
        run: |
          cd ${{ github.workspace }}/termux-app
          BOOTSTRAP=$(find ${{ github.workspace }}/termux-packages -name 'bootstrap-aarch64.zip' | head -1)
          if [ -z "$BOOTSTRAP" ]; then
            echo "ERROR: bootstrap-aarch64.zip not found"; exit 1
          fi
          # кладём кастомный bootstrap в cpp, чтобы он не перезаписался
          mkdir -p app/src/main/cpp
          cp "$BOOTSTRAP" app/src/main/cpp/bootstrap-aarch64.zip
          echo "Embedded bootstrap: $BOOTSTRAP ($(du -h "$BOOTSTRAP" | cut -f1))"
          # запрещаем downloadBootstrap() перезаписывать наш bootstrap
          python3 - <<'PYEOF'
import re
p='app/build.gradle'
s=open(p).read()
if 'return;' not in s.split('downloadBootstrap()',1)[1][:300]:
    s=s.replace('downloadBootstrap() {','downloadBootstrap() {\n        return;',1)
    open(p,'w').write(s)
    print("Patched downloadBootstrap() with return;")
else:
    print("downloadBootstrap already patched")
PYEOF
          # вшиваем агент и конфиг в assets
          mkdir -p app/src/main/assets/agent
          cp ${{ github.workspace }}/repo/agent-runtime.js app/src/main/assets/agent/
          cp -r ${{ github.workspace }}/repo/config app/src/main/assets/agent/
        timeout-minutes: 5

      - name: Build APK (assembleRelease)
        run: |
          cd ${{ github.workspace }}/termux-app
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tail -80
        timeout-minutes: 120

      - name: Collect APK
        run: |
          mkdir -p ${{ github.workspace }}/repo/dist
          find ${{ github.workspace }}/termux-app -name '*.apk' -exec cp {} ${{ github.workspace }}/repo/dist/ \;
          ls -la ${{ github.workspace }}/repo/dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: dist/*.apk

      - name: Publish to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          tag_name: v${{ github.run_number }}
          name: Multi CLI-Agent v${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
