<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MangaLib Plus</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { font-family: system-ui,-apple-system,sans-serif; background:#1a1a2e; overflow:hidden; }
  #frameHost { width:100%; height:100vh; position:relative; }
  #frameHost iframe { width:100%; height:100%; border:none; }
  #loader { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#1a1a2e; color:#cfd0e0; font-size:16px; z-index:40; }
</style>
</head>
<body>
<div id="frameHost"></div>
<div id="loader">Загрузка MangaLib Plus…</div>
<script>
const MANGALIB_URL = "./mangalib-plus.html";
const host = document.getElementById("frameHost");
const loader = document.getElementById("loader");
const iframe = document.createElement("iframe");
iframe.src = MANGALIB_URL;
host.appendChild(iframe);
iframe.onload = () => { loader.style.display = "none"; };
setTimeout(() => { loader.style.display = "none"; }, 8000);
</script>
</body>
</html>
