<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MangaLib Plus</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { font-family: system-ui,-apple-system,sans-serif; background:#1a1a2e; overflow:hidden; }
  #frameHost { width:100%; height:100vh; }
  #frameHost iframe { width:100%; height:100%; border:none; }
</style>
</head>
<body>
<div id="frameHost"></div>
<script>
// Офлайн-fallback: грузим улучшенный MangaLib из assets.
// Онлайн: MainActivity грузит свежую версию с GitHub Pages (автообновление).
const M = "file:///android_asset/mangalib-plus.html";
const f = document.createElement("iframe");
f.src = M;
document.getElementById("frameHost").appendChild(f);
</script>
</body>
</html>
